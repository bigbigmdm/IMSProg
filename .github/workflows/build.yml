name: Build

on:
  push:
    branches-ignore:
      - "debian/**"
    paths-ignore:
      - "README.md"
      - "**/README.md"
      - "**/index.html"
  pull_request:
    branches-ignore:
      - "debian/**"
    paths-ignore:
      - "README.md"
      - "**/README.md"
      - "**/index.html"
  workflow_dispatch:

env:
  CMAKE_INSTALL_PARALLEL_LEVEL: 4

jobs:
  amd64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Optimized layout: Keeping only target production Ubuntu systems
        name: [Ubuntu-22, Ubuntu-24, Ubuntu-26]
        cpp_compiler: [g++]
        include:
          - name: Ubuntu-22
            image: "ubuntu:22.04"
            ubuntu: 22
            deps: cmake g++ libusb-1.0-0-dev qtbase5-dev qttools5-dev pkgconf udev libftdi1-dev file
          - name: Ubuntu-24
            image: "ubuntu:24.04"
            ubuntu: 24
            deps: cmake g++ libusb-1.0-0-dev pkgconf qt6-base-dev qt6-tools-dev linguist-qt6 qt6-l10n-tools qt6-base-dev-tools qt6-tools-dev-tools systemd-dev libftdi1-dev file
          - name: Ubuntu-26
            image: "ubuntu:26.04"
            ubuntu: 26
            deps: cmake g++ libusb-1.0-0-dev pkgconf qt6-base-dev qt6-tools-dev linguist-qt6 qt6-l10n-tools qt6-base-dev-tools qt6-tools-dev-tools libftdi1-dev systemd-dev file
    container:
      image: ${{ matrix.image }}
      env:
        LANG: en_US.UTF-8
        CC: ${{ matrix.c_compiler }}
        CXX: ${{ matrix.cpp_compiler }}
        WITH_PROJ: ON
        APT_LISTCHANGES_FRONTEND: none
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install packages required
        shell: bash
        run: |
          echo "Installing dependencies for ${{ matrix.name }}"
          apt-get update -qq
          apt-get install -yq ${{ matrix.deps }}
      
      - uses: actions/checkout@v7
      
      - name: Build and Package DEB
        working-directory: .
        run: |
          cmake -S . -B build/ -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ --parallel
          cmake --install build/
          
          cd build
          cpack -G DEB \
            -D CPACK_PACKAGE_NAME="imsprog" \
            -D CPACK_PACKAGE_VENDOR="BigBigMDM" \
            -D CPACK_PACKAGE_VERSION="1.8.6" \
            -D CPACK_PACKAGE_DESCRIPTION_SUMMARY="IMSProg - I2C/SPI/MicroWire Flash Programmer Suite" \
            -D CPACK_PACKAGE_DESCRIPTION="IMSProg is a Linux/macOS programmer suite for I2C, SPI, and MicroWire EEPROM/Flash chips, featuring fully integrated database management, hardware controllers, and visual editor tools." \
            -D CPACK_PACKAGE_CONTACT="BigBigMDM <https://github.com>" \
            -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON \
            -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE="amd64" \
            -D CPACK_INSTALL_CMAKE_PROJECTS=".;IMSProg;ALL;/" \
            -D CPACK_PACKAGE_FILE_NAME="imsprog" \
            -D CPACK_CMAKE_GENERATOR="Unix Makefiles"
          
          mkdir -p ../dist-deb
          mv imsprog*.deb ../dist-deb/imsprog-${{ matrix.name }}-amd64.deb

      - name: Upload DEB Artifacts
        uses: actions/upload-artifact@main
        with:
          name: deb-${{ matrix.name }}
          path: dist-deb/*.deb

  fedora-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          dnf install -y dnf-plugins-core rpm-build rpmlint rpmdevtools wget \
                         hunspell-es hunspell-it hunspell-pt libftdi-devel
          dnf builddep -y rpm/*.spec
      - name: Prepare build environment
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp rpm/*.spec ~/rpmbuild/SPECS/
          spectool -g -R ~/rpmbuild/SPECS/*.spec
      - name: Build RPM package
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/*.spec
      - name: Check RPM with rpmlint
        run: |
          rpmlint ~/rpmbuild/RPMS/*/*.rpm || true
      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@main
        with:
          name: fedora-44-rpm
          path: ~/rpmbuild/RPMS/*/*.rpm

  # --- MacOS ---
  macos:
    runs-on: macos-15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install dependencies via Homebrew
        run: |
          HOMEBREW_NO_INSTALL_FROM_API=1 brew update
          brew install qt@6 libusb pkg-config libftdi

      - name: Configure CMake
        run: |
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6) \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
            -DCMAKE_EXE_LINKER_FLAGS="-L/opt/homebrew/lib -L/usr/local/lib"

      - name: Build Application
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Deployment Artifacts (Create Multi-App DMG)
        run: |
          mkdir -p dmg_staging

          # Helper function to construct a macOS .app bundle around a binary
          package_binary_to_app() {
            local app_name="$1"
            local binary_path="$2"
            local png_path="$3"
            local icon_name="$4"

            echo "Building bundle for $app_name..."

            # 1. Create standard macOS bundle layout
            local bundle_dir="dmg_staging/${app_name}.app"
            mkdir -p "${bundle_dir}/Contents/MacOS"
            mkdir -p "${bundle_dir}/Contents/Resources"

            # 2. Locate and copy the compiled binary
            if [ -f "$binary_path" ]; then
              cp "$binary_path" "${bundle_dir}/Contents/MacOS/${app_name}"
              chmod +x "${bundle_dir}/Contents/MacOS/${app_name}"
            else
              echo "Error: Binary $binary_path not found!"
              exit 1
            fi

            # 3. Create Info.plist
            cat <<EOF > "${bundle_dir}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${app_name}</string>
              <key>CFBundleIconFile</key>
              <string>${icon_name}.icns</string>
              <key>CFBundleIdentifier</key>
              <string>com.imsprog.${app_name}</string>
              <key>CFBundleName</key>
              <string>${app_name}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
          </dict>
          </plist>
          EOF

            # 4. Generate .icns icon from PNG if provided
            if [ -f "$png_path" ]; then
              echo "Converting icon for $app_name..."
              mkdir -p icon.iconset
              sips -z 16 16     "$png_path" --out icon.iconset/icon_16x16.png
              sips -z 32 32     "$png_path" --out icon.iconset/icon_16x16@2x.png
              sips -z 32 32     "$png_path" --out icon.iconset/icon_32x32.png
              sips -z 64 64     "$png_path" --out icon.iconset/icon_32x32@2x.png
              sips -z 128 128   "$png_path" --out icon.iconset/icon_128x128.png
              sips -z 256 256   "$png_path" --out icon.iconset/icon_128x128@2x.png
              sips -z 256 256   "$png_path" --out icon.iconset/icon_256x256.png
              sips -z 512 512   "$png_path" --out icon.iconset/icon_256x256@2x.png
              sips -z 512 512   "$png_path" --out icon.iconset/icon_512x512.png
              sips -z 1024 1024 "$png_path" --out icon.iconset/icon_512x512@2x.png

              iconutil -c icns icon.iconset -o "${icon_name}.icns"
              cp "${icon_name}.icns" "${bundle_dir}/Contents/Resources/"
              rm -rf icon.iconset "${icon_name}.icns"
            fi
          }

          # Search for compiled binaries inside build folder and wrap them into .app bundles
          IMSPROG_BIN=$(find build -name "IMSProg" -type f -not -path "*/.*" | head -n 1)
          EDITOR_BIN=$(find build -name "IMSProg_editor" -type f -not -path "*/.*" | head -n 1)
          DB_BIN=$(find build -name "IMSProg_database_update" -type f -not -path "*/.*" | head -n 1)

          package_binary_to_app "IMSProg" "$IMSPROG_BIN" "IMSProg_programmer/IMSProg64.png" "IMSProg"
          package_binary_to_app "IMSProg_editor" "$EDITOR_BIN" "IMSProg_editor/chipEdit64.png" "chipEdit"
          package_binary_to_app "IMSProg_database_update" "$DB_BIN" "IMSProg_database_update/IMSProg_database_update.png" "IMSProg_db"

          # Deploy Qt dependencies using macdeployqt
          export DYLD_LIBRARY_PATH="/opt/homebrew/lib:$DYLD_LIBRARY_PATH"
          QT_BIN="$(brew --prefix qt@6)/bin"

          $QT_BIN/macdeployqt dmg_staging/IMSProg.app
          $QT_BIN/macdeployqt dmg_staging/IMSProg_editor.app
          $QT_BIN/macdeployqt dmg_staging/IMSProg_database_update.app

          # Create final unified DMG disk image
          hdiutil create -volname "IMSProg Programmer Suite" -srcfolder dmg_staging -ov -format UDZO imsprog-macos-arm64.dmg
          mkdir -p dist-dmg
          mv imsprog-macos-arm64.dmg dist-dmg/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@main
        with:
          name: macos-arm64-dmg
          path: dist-dmg/*.dmg
