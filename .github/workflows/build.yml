name: Build

on:
#  push:
#    branches-ignore:
#      - "debian/**"
#    paths-ignore:
#      - "README.md"
#      - "**/README.md"
#      - "**/index.html"
#  pull_request:
#    branches-ignore:
#      - "debian/**"
#    paths-ignore:
#      - "README.md"
#      - "**/README.md"
#      - "**/index.html"
  workflow_dispatch:

env:
  CMAKE_INSTALL_PARALLEL_LEVEL: 4

jobs:
  amd64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Optimized layout: Keeping only target production Ubuntu systems
        name: [Ubuntu-22, Ubuntu-24, Ubuntu-26]
        cpp_compiler: [g++]
        include:
          - name: Ubuntu-22
            image: "ubuntu:22.04"
            ubuntu: 22
            deps: cmake g++ libusb-1.0-0-dev qtbase5-dev qttools5-dev pkgconf udev libftdi1-dev file
          - name: Ubuntu-24
            image: "ubuntu:24.04"
            ubuntu: 24
            deps: cmake g++ libusb-1.0-0-dev pkgconf qt6-base-dev qt6-tools-dev linguist-qt6 qt6-l10n-tools qt6-base-dev-tools qt6-tools-dev-tools systemd-dev libftdi1-dev file
          - name: Ubuntu-26
            image: "ubuntu:26.04"
            ubuntu: 26
            deps: cmake g++ libusb-1.0-0-dev pkgconf qt6-base-dev qt6-tools-dev linguist-qt6 qt6-l10n-tools qt6-base-dev-tools qt6-tools-dev-tools libftdi1-dev systemd-dev file
    container:
      image: ${{ matrix.image }}
      env:
        LANG: en_US.UTF-8
        CC: ${{ matrix.c_compiler }}
        CXX: ${{ matrix.cpp_compiler }}
        WITH_PROJ: ON
        APT_LISTCHANGES_FRONTEND: none
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install packages required
        shell: bash
        run: |
          echo "Installing dependencies for ${{ matrix.name }}"
          apt-get update -qq
          apt-get install -yq ${{ matrix.deps }}
      
      - uses: actions/checkout@v7
      
      - name: Build and Package DEB
        working-directory: .
        run: |
          cmake -S . -B build/ -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ --parallel
          cmake --install build/
          
          cd build
          cpack -G DEB \
            -D CPACK_PACKAGE_NAME="imsprog" \
            -D CPACK_PACKAGE_VENDOR="BigBigMDM" \
            -D CPACK_PACKAGE_VERSION="1.8.6" \
            -D CPACK_PACKAGE_DESCRIPTION_SUMMARY="IMSProg - I2C/SPI/MicroWire Flash Programmer Suite" \
            -D CPACK_PACKAGE_DESCRIPTION="IMSProg is a Linux/macOS programmer suite for I2C, SPI, and MicroWire EEPROM/Flash chips, featuring fully integrated database management, hardware controllers, and visual editor tools." \
            -D CPACK_PACKAGE_CONTACT="BigBigMDM <https://github.com>" \
            -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON \
            -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE="amd64" \
            -D CPACK_INSTALL_CMAKE_PROJECTS=".;IMSProg;ALL;/" \
            -D CPACK_PACKAGE_FILE_NAME="imsprog" \
            -D CPACK_CMAKE_GENERATOR="Unix Makefiles"
          
          mkdir -p ../dist-deb
          mv imsprog*.deb ../dist-deb/imsprog-${{ matrix.name }}-amd64.deb

      - name: Upload DEB Artifacts
        uses: actions/upload-artifact@main
        with:
          name: deb-${{ matrix.name }}
          path: dist-deb/*.deb

  fedora-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          dnf install -y dnf-plugins-core rpm-build rpmlint rpmdevtools wget \
                         hunspell-es hunspell-it hunspell-pt libftdi-devel
          dnf builddep -y rpm/*.spec
      - name: Prepare build environment
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp rpm/*.spec ~/rpmbuild/SPECS/
          spectool -g -R ~/rpmbuild/SPECS/*.spec
      - name: Build RPM package
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/*.spec
      - name: Check RPM with rpmlint
        run: |
          rpmlint ~/rpmbuild/RPMS/*/*.rpm || true
      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@main
        with:
          name: fedora-44-rpm
          path: ~/rpmbuild/RPMS/*/*.rpm

  # --- MacOS ---
  macos:
    runs-on: macos-15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install dependencies via Homebrew
        run: |
          brew update
          brew install qt@6 libusb pkg-config libftdi create-dmg

      - name: Configure CMake
        run: |
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_MACOSX_BUNDLE=ON \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/dmg_staging" \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
            -DCMAKE_EXE_LINKER_FLAGS="-L/opt/homebrew/lib -L/usr/local/lib"

      - name: Build Application
        run: |
          cmake --build build --config Release --parallel

      - name: Deploy and Sign macOS App Bundles
        run: |
          export DYLD_LIBRARY_PATH="/opt/homebrew/lib:${DYLD_LIBRARY_PATH:-}"
          for app in dmg_staging/*.app; do
            "$(brew --prefix qt@6)/bin/macdeployqt" "$app" -codesign=-
          done

      - name: Create DMG
        run: |
          mkdir -p dist-dmg
          create-dmg \
            --volname "IMSProg Programmer Suite" \
            --window-size 900 400 \
            --icon-size 80 \
            --icon "IMSProg.app" 120 180 \
            --icon "IMSProg_editor.app" 340 180 \
            --icon "IMSProg_database_update.app" 560 180 \
            --app-drop-link 780 180 \
            dist-dmg/imsprog-macos-arm64.dmg \
            dmg_staging/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@main
        with:
          name: macos-arm64-dmg
          path: dist-dmg/*.dmg
